name: Pull Request Quality Gates

on:
  push:

env:
  NEXT_PUBLIC_SITE_URL: mock-next-public-site-url
  # Firebase client (NEXT_PUBLIC_* are baked into the Next.js build)
  NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMYDUM
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: mock.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: mock-firebase-project
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:abcdef1234567890abcdef
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: mock-firebase-project.appspot.com
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-ABCDEFGH12

  # Firebase Admin (server-side). Keep as mocks for PR gates.
  FIREBASE_ADMIN_PROJECT_ID: mock-firebase-project
  FIREBASE_ADMIN_CLIENT_EMAIL: mock-firebase-admin@mock-firebase-project.iam.gserviceaccount.com
  FIREBASE_ADMIN_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nMOCK\\n-----END PRIVATE KEY-----\\n"
  SAMPLE_PAX: mock-sample-pax
  SAMPLE_AO: mock-sample-ao
  SAMPLE_REGION: mock-sample-region
  ENVIRONMENT: mock-environment
  BIGQUERY_PROJECT_ID: mock-bigquery-project-id
  BIGQUERY_DATASET: mock-bigquery-dataset
  BIGQUERY_CLIENT_EMAIL: mock-bigquery-client-email
  BIGQUERY_PRIVATE_KEY: mock-bigquery-private-key

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage with threshold
        run: npm run test:coverage
