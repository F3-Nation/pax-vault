# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 1
  memoryMiB: 2048
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1

# Environment variables and secrets.
env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  - variable: NEXT_PUBLIC_SITE_URL
    secret: next-public-site-url
    availability:
      - BUILD
      - RUNTIME

  - variable: SAMPLE_PAX
    secret: sample-pax
    availability:
      - BUILD
      - RUNTIME

  - variable: SAMPLE_AO
    secret: sample-ao
    availability:
      - BUILD
      - RUNTIME

  - variable: SAMPLE_REGION
    secret: sample-region
    availability:
      - BUILD
      - RUNTIME

  - variable: ENVIRONMENT
    secret: environment
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_PROJECT_ID
    secret: bigquery-project-id
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_DATASET
    secret: bigquery-dataset
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_CLIENT_EMAIL
    secret: bigquery-client-email
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_PRIVATE_KEY
    secret: bigquery-private-key
    availability:
      - BUILD
      - RUNTIME

  - variable: OAUTH_CLIENT_ID
    secret: oauth-client-id
    availability:
      - BUILD
      - RUNTIME

  - variable: OAUTH_CLIENT_SECRET
    secret: oauth-client-secret
    availability:
      - RUNTIME

  - variable: OAUTH_REDIRECT_URI
    secret: oauth-redirect-uri
    availability:
      - BUILD
      - RUNTIME

  - variable: AUTH_PROVIDER_URL
    secret: auth-provider-url
    availability:
      - BUILD
      - RUNTIME

  - variable: SESSION_SECRET
    secret: session-secret
    availability:
      - RUNTIME

  # DuckDB read path for analytical pv_* data (see docs/duckdb-operations.md).
  # Capability flags (DUCKDB_SEARCH_ENABLED, DUCKDB_EVENTS_ENABLED,
  # DUCKDB_STATS_*_ENABLED, DUCKDB_AUTH_ENABLED) are left unset so every
  # capability inherits DUCKDB_ENABLED; set one to "false" to cut just that
  # capability back to BigQuery, or DUCKDB_ENABLED to "false" to cut back all.
  - variable: DUCKDB_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: DUCKDB_SHADOW_ENABLED
    value: "false"
  - variable: DUCKDB_SHADOW_TIMEOUT_MS
    value: "500"
  - variable: DUCKDB_GCS_BUCKET
    value: "f3-analytics"
  - variable: DUCKDB_GCS_PREFIX
    value: "pax-vault/releases"
  - variable: DUCKDB_GCS_CONTROL_OBJECT
    value: "pax-vault/current.json"
  - variable: DUCKDB_CACHE_DIR
    value: "/tmp/pax-vault-duckdb"
  - variable: DUCKDB_REFRESH_TTL_MS
    value: "300000"
  # Serve a last-known-good release for at most 24 hours of failed refreshes.
  # Sign-in and region-admin checks read this snapshot, so this also bounds
  # how long a removed user or revoked admin keeps access.
  - variable: DUCKDB_MAX_LKG_AGE_MS
    value: "86400000"
  - variable: DUCKDB_MEMORY_LIMIT
    value: "384MB"
  - variable: DUCKDB_MAX_RELEASE_BYTES
    value: "536870912"
  - variable: DUCKDB_MAX_OBJECT_BYTES
    value: "402653184"
  # Bearer token for POST /api/internal/duckdb/refresh, called by the Cloud
  # Scheduler job duckdb-scheduled-refresh (see docs/duckdb-operations.md).
  - variable: DUCKDB_REFRESH_TOKEN
    secret: duckdb-refresh-token
    availability:
      - RUNTIME
