# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 1
  memoryMiB: 2048
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1

# Environment variables and secrets.
env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  - variable: NEXT_PUBLIC_SITE_URL
    secret: next-public-site-url
    availability:
      - BUILD
      - RUNTIME

  - variable: SAMPLE_PAX
    secret: sample-pax
    availability:
      - BUILD
      - RUNTIME

  - variable: SAMPLE_AO
    secret: sample-ao
    availability:
      - BUILD
      - RUNTIME

  - variable: SAMPLE_REGION
    secret: sample-region
    availability:
      - BUILD
      - RUNTIME

  - variable: ENVIRONMENT
    secret: environment
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_PROJECT_ID
    secret: bigquery-project-id
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_DATASET
    secret: bigquery-dataset
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_CLIENT_EMAIL
    secret: bigquery-client-email
    availability:
      - BUILD
      - RUNTIME

  - variable: BIGQUERY_PRIVATE_KEY
    secret: bigquery-private-key
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: next-public-firebase-api-key
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: next-public-firebase-auth-domain
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: next-public-firebase-project-id
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: next-public-firebase-app-id
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: next-public-firebase-messaging-sender-id
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: next-public-firebase-storage-bucket
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: next-public-firebase-measurement-id
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_ADMIN_PROJECT_ID
    secret: firebase-admin-project-id
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: firebase-admin-client-email
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
    availability:
      - BUILD
      - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef
